; PlatformIO Project Configuration File

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++2a -std=gnu++2b -Werror=reorder
build_flags =
    -std=gnu++20
    -mtext-section-literals
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
build_src_flags =
    -Wall
    -Werror

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
;platform = espressif32 @ 6.12.0
board = lolin32
framework = arduino
;board_build.partitions = no_ota.csv  ; no plans for OTA anyway, so just reclaim some space

lib_deps =
    EEPROM
    etlcpp/Embedded Template Library @ ~20.47
    tzapu/WiFiManager @ ^2.0.17
    ; flash62au/WiThrottleProtocol @ ^1.1.27
    ; Pinned: lv_conf.h is version specific, and tools/sim verifies the UI against this
    ; exact version. A loose constraint lets different envs build different LVGL.
    lvgl/lvgl@9.5.0
    olikraus/U8g2 @ ^2.36.18
;    ESP32Async/AsyncTCP @ ^3.4.10

monitor_filters = esp32_exception_decoder
monitor_speed = 115200

; Same firmware, but flushing through blit_i1_to_vlsb() instead of blit_i1_hline().
; Both render identically; this one writes the U8g2 frame buffer directly, which is
; faster but only valid for the "vertical top LSB" layout (SSD13xx and friends).
; The per-flush timings printed over serial let the two be compared on real hardware.
[env:esp32_vlsb]
extends = env:esp32
build_flags =
    ${env.build_flags}
    -D MONO_BLITTER_VLSB
